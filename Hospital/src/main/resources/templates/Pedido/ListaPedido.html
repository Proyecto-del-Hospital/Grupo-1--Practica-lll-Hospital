<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<title>Control de Pedidos</title>
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>

	<main class="container my-4">
		<section>
			<div>

				<div class="row justify-content-center mb-3">
					<div class="col-md-11 d-flex justify-content-between align-items-center">
						<a th:href="@{/ControlSolicitud}" class="btn btn-secondary">
							← Ir a Solicitudes
						</a>
					</div>
				</div>

				<article class="mb-4" th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
					<div class="row justify-content-center">
						<div class="col-md-13">
							<div class="shadow-lg p-4 bg-body-tertiary rounded">
								<h3 class="text-center text-primary pb-3">Listado de Pedidos</h3>

								<div class="table-responsive">
									<table class="table table-bordered table-striped table-hover align-middle mb-0">
										<thead class="table-dark">
											<tr class="text-center text-nowrap align-middle">
												<th>N° Pedido</th>
												<th>Fecha</th>
												<th>Solicitado por:</th>
												<th>Observacion</th>
												<th>Responsable</th>
												<th>Estado</th>
												<th>Acciones</th>
											</tr>
										</thead>
										<tbody class="text-center text-nowrap align-middle">
											<tr th:each="ped : ${listaPedidos}" class="text-center ">
												<td class="fw-bold" th:text="${'#' + ped.id}"></td>
												<td th:text="${ped.fecha}"></td>
												<td
													th:text="${ped.solicitud.empleado.nombre +' '+ ped.solicitud.empleado.apellido}">
												</td>
												<td th:text="${ped.motivo}"></td>

												<td th:text="${ped.empleado.nombre}"></td>
												<td>
													<span class="badge"
														th:classappend="${ped.estado.nombre == 'Pendiente' ? 'bg-warning text-dark' : 'bg-success'}"
														th:text="${ped.estado.nombre}">
													</span>
												</td>
												<td>
													<div class="d-flex justify-content-center align-items-center gap-2 text-nowrap"
													 style="gap: 8px;">
														<a class="btn btn-info btn-sm"
															th:href="@{/detallePedido(idPedido=${ped.id})}">
															Ver Detalles
														</a>
														<a class="btn btn-info btn-sm"
															th:href="@{/detalleSolicitud(id=${ped.solicitud.id})}">
															Ver Solicitud
														</a>
														<a class="btn btn-danger btn-sm"
															th:href="@{/detalleSolicitud(id=${ped.solicitud.id})}">
															Generar Factura
														</a>
													</div>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</article>
			</div>
		</section>
	</main>
</body>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</html>
