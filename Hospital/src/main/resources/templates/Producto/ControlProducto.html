<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/CSS/style.css}">
	<script src="https://kit.fontawesome.com/57faba85b1.js" crossorigin="anonymous"></script>
	<title>Control de Producto</title>
</head>

<body>
	<header>
		<div th:replace="Inicio/Home::navbar"></div>
	</header>
	<main>
		<section>
			<div class="justify-content-center w-100 p-5">
				<article>
					<div class="row justify-content-center">
						<div class="col-md-8">
							<div th:if="${exito}" class="alert alert-info text-center pt-4" role="alert">
								<p th:text="${exito}"></p>
							</div>
							<div class="shadow-lg p-2 bg-body-tertiary rounded">
								<h3 class="mb-4 text-center"
									th:text="${Editar == null} ? 'Registrar Producto' : 'Modificar Producto'"></h3>
								<form class="row g-2" method="post"
									th:action="${Editar == null} ? @{/guardarproducto} : @{/modificarproducto}"
									th:object="${producto}">
									<input type="hidden" th:field="*{id}">
									<div class="col-md-6">
										<label class="form-label">Nombre del Producto</label>
										<input type="text" class="form-control form-control-sm" th:field="*{nombre}"
											required placeholder="Ingrese el nombre del producto">
									</div>
									<div class="col-md-6">
										<label class="form-label">Tipo del Producto</label>
										<select class="form-control form-control-sm" th:field="*{tipo.nombre}" required>
											<option value="">Seleccione un Tipo</option>
											<option value="Alimenticio">Alimenticio</option>
											<option value="Limpieza">Limpieza</option>
										</select>
									</div>
									<div class="col-md-6">
										<label class="form-label">SubTipo del Producto</label>
										<select class="form-control form-control-sm" th:field="*{subtipo.nombre}"
											required>
											<option value="">Seleccione el subtipo</option>
											<option value="Fresco">Fresco</option>
											<option value="Seco">Seco</option>
											<option value="Ninguno">Ninguno</option>
										</select>
									</div>
									<div class="col-md-6">
										<label class="form-label">Unidad del Producto</label>
										<select class="form-control form-control-sm" th:field="*{unidad.nombre}"
											required>
											<option value="">Seleccione una unidad</option>
											<option value="Litro">Litro (L)</option>
											<option value="Mililitro">Mililitro (ml)</option>
											<option value="Gramo">Gramo (g)</option>
											<option value="Kilogramo">Kilogramo (kg)</option>
											<option value="Unidad">Unidad (Ud)</option>
										</select>
									</div>
									<div class="col-md-6">
										<label class="form-label">Stock actual</label>
										<input type="number" class="form-control form-control-sm"
											th:field="*{stockactual}" step="any" placeholder="Ingrese el stock actual">
									</div>
									<div class="col-md-6">
										<label class="form-label">Stock mínimo</label>
										<input type="number" class="form-control form-control-sm"
											th:field="*{stockminimo}" step="any" required
											placeholder="Ingres el stock mínimo">
									</div>
									<div class="col-12 mt-4">
										<button type="submit" class="btn btn-primary w-100">Guardar</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</article>
				<br><br>
				<article>
					<div class="align-items-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
						<form class="d-flex me-2" th:action="@{/busquedaProducto}" method="post">
							<input class="form-control me-2" type="text" name="nombre"
								placeholder="Buscar producto por nombre">
							<button class="btn btn-outline-success" type="submit">Buscar</button>
						</form>
						<br>
						<div class="row justify-content-center ">
							<a class="btn btn-success m-2" th:href="@{/producto/filtrar(nombre='Disponible')}">
								Disponible
							</a>
							<a class="btn btn-warning text-dark m-2" th:href="@{/producto/filtrar(nombre='Bajo Stock')}">
								Bajo Stock
							</a>
							<a class="btn btn-danger m-2" th:href="@{/producto/filtrar(nombre='Deshabilitado')}">
								Deshabilitado
							</a>
							<a class="btn btn-secondary m-2" th:href="@{/controlproducto}">Todos</a>
						</div>
						<br>
						<div class="table-responsive">
							<table class="table table-bordered table-striped table-hover tabla-pacientes mb-0">
								<thead class="table-dark">
									<tr class="text-center">
										<th>ID</th>
										<th>Nombre</th>
										<th>TIPO</th>
										<th>SUBTIPO</th>
										<th>UNIDAD</th>
										<th>STOCK ACTUAL</th>
										<th>STOCK MINIMO</th>
										<th>MOTIVO</th>
										<th>ESTADO</th>
										<th>ACCIÓN</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="p : ${ListaProductos}" class="text-center">
										<td th:text="${p.id}"></td>
										<td th:text="${p.nombre}"></td>
										<td th:text="${p.tipo.nombre}"></td>
										<td th:text="${p.subtipo.nombre}"></td>
										<td th:text="${p.unidad.nombre}"></td>
										<td th:text="${p.stockactual}"></td>
										<td th:text="${p.stockminimo}"></td>
										<td th:text="${p.motivo}"></td>
										<td> <span class="badge estado-badge" th:classappend="${p.estado.nombre == 'Disponible'} ? 'bg-success' :
										                          (${p.estado.nombre == 'Deshabilitado'} ? 'bg-danger' :
										                          (${p.estado.nombre == 'Bajo Stock'} ? 'bg-warning text-dark' : 'bg-secondary'))"
												th:text="${p.estado.nombre}">
											</span></td>
										<td><a class="btn btn-primary btn-sm"
												th:href="@{/producto/formularioM(id=${p.id})}">Modificar</a>
											<a class="btn btn-warning btn-sm"
												th:href="@{/producto/cambiarEstado(id=${p.id})}">Cambiar Estado</a>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</article>
			</div>
		</section>
	</main>
</body>

</html>
