<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<title>Detalle Solicitud</title>
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>
	<main>
		<div class=" conteiner justify-content-center w-70 pt-3 pl-5 pr-5">
			<section>
				<article>
					<div class="align-items-center shadow-lg  bg-body-tertiary rounded ">
						<h4 class="mb-4 text-center text-primary pt-3">Detalle de Consumo #<span
								th:text="${consumo.id}"></span></h4>
						<div class="table-responsive ">
							<div class="table-responsive">
								<table class="table table-bordered table-striped table-hover mb-0">
									<tbody>
										<tr class="text-center">
										<tr>
											<th class="table-light">fecha de cuando se realizo el consumo</th>
											<td th:text="${consumo.fecha}"> </td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
				</article>
				<br>
				<article>
					<div class="align-items-center shadow-lg  bg-body-tertiary rounded ">
						<h4 class="mb-4 text-center text-primary pt-3">Detalle de Consumo</h4>
						<div class="table-responsive">
							<table class="table table-bordered table-striped table-hover mb-0">
								<thead class="table-dark">
									<tr class="text-center">
										<th>ID</th>

										<th>Empleado</th>
										<th>Turno</th>
										<th>producto</th>
										<th>Cantidad consumido</th>
										<th>Stock actual</th>
										<th>Stock minimo</th>
									</tr>
								</thead>
								<tbody class="text-center">
									<tr class="text-center" th:each="d : ${ListaDetConsumo}">
										<td th:text="${d.id}"> </td>

										<td th:text="${d.empleado.nombre}"></td>
										<td th:text="${d.turno.nombre}"></td>
										<td class="text-start" th:text="${d.productococina.nombre}"></td>
										<td th:text="${d.cantidad + ' ' + d.productococina.unidad.nombre}"></td>
										<td th:text="${d.productococina.stockactual + ' ' + d.productococina.unidad.nombre}"></td>
										<td th:text="${d.productococina.stockminimo + ' ' + d.productococina.unidad.nombre}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</article>
			</section>
		</div>
	</main>
</body>

</html>
