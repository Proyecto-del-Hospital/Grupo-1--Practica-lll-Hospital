<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<title>Control de Solicitud</title>
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>
	<main>
		<section>
			<div class="justify-content-center pt-3 pl-5 pr-5">

				<div th:if="${mensaje}" class="alert alert-success text-center">
					<p th:text="${mensaje}">
					</p>
				</div>
				<article>
					<div class="justify-content-center pr-5 pl-5 ">
							<a th:href="@{/}" class="btn btn-secondary mb-3">
								← Volver al inicio
							</a>
							<div class="shadow-lg p-2 bg-body-tertiary rounded">
							<form th:action="@{/Agregar}"class="row g-2" method="post" > 
								<select name="productoId" required>
									<option value=" ">
										Selccione un Producto
										</option>
										<br>
											<option th:each="p : ${ListaProductos}" th:value="${p.id}" th:text="${p.nombre}">
											</option>
									</select>
										<input type="number" step="any" placeholder="Ingrese cantidad" class="form-control form-control-sm" name="cantidad" min="0">
										<button type="submit" class="btn btn-primary w-100" >agregar a la lista</button>
								</form>	
								<br>
								<h2> Lista de Productos seleccionados</h2>
								<div class="table-responsive">
															<table class="table table-bordered table-striped table-hover mb-0 ">
																<thead class="table-dark">
																	<tr class="text-center">
																		<th>Producto</th>
																		<th>Cantidad</th>
																		<th>Accion</th>
																	</tr>
																</thead>
																<tbody>
																	<tr class="text-center " th:each="d : ${ListDetallSolicitud}">
																		<td th:text="${d.producto.nombre}"></td>
																		<td th:text=${d.cantidad}></td>
																		<td>
																		<form th:action="@{/QuitarProductoListaS}"class="row g-2" method="post">
																			<input type="hidden" name="posicion" th:value= "${d.producto.id}">
																			<button type="submit" class="btn btn-danger" >Quitar de la Lista</button>
																		</form>
																		</td>
																		</tr>
																</tbody>
															</table>
															<form th:action="@{/GuardarSolicitud}"class="row g-2" method="post">
																<div class="col-6">
																	<label class="form-label">motivo: </label>
														<input type="text" name="motivo" placeholder="motivo de la solicitud">	
														</div>
														<div class="col-12 mt-2">
															<button type="submit" class="btn btn-danger" >Guardar Solicitud</button>
															</div>
														</form>
														</div>
							</div>
							
					</div>
				</article>

			</div>
		</section>
	</main>
</body>

</html>
