<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<title>Detalle Solicitud</title>
	
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>
	<main>
		<div class=" conteiner justify-content-center w-70 pt-3 pl-5 pr-5">
			<section>
				<article>
					<div class="align-items-center shadow-lg  bg-body-tertiary rounded ">
						<h4 class="mb-4 text-center text-primary pt-3">Lista de Solicitud</h4>
						<div class="table-responsive ">
							<div class="table-responsive">
								<table class="table table-bordered table-striped table-hover mb-0">
									<tbody>
										<tr class="text-center">
										<tr>
											<th class="table-light">Usuario del Empleado que Solicitud</th>
											<td th:text="${solicitud.empleado.usuario.nombreu}"> </td>
										</tr>
										<tr>
											<th class="table-light">Solicitud del Empleado</th>
											<td>
												<span
													th:text="${solicitud.empleado.nombre + ' ' + solicitud.empleado.apellido}"></span>
												<span class="text-muted"
													th:text="' (' + ${solicitud.empleado.usuario.rol.nombre} + ')'"></span>
											</td>
										</tr>
										<tr>
											<th class="table-light">Fecha de la Solicitud</th>
											<td th:text="${solicitud.fecha}"></td>
										</tr>
										<tr>
											<th class="table-light">Motivo de la Solicitud</th>
											<td th:text="${solicitud.motivo}"></td>
										</tr>
										<tr>
											<th class="table-light">Estado de la Solicitud</th>
											<td> <span class="badge estado-badge"
												 th:classappend="${solicitud.estado.nombre == 'Aceptado'} ? 'bg-success' :
												(${solicitud.estado.nombre == 'Rechazado'} ? 'bg-danger' :
												(${solicitud.estado.nombre == 'Pendiente'} ? 'bg-warning text-dark' :
												(${solicitud.estado.nombre == 'En Proceso de Compra'} ? 'bg-info' : 'bg-warning')))"
												th:text="${solicitud.estado.nombre}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
				</article>
				<br>
				<article>
					<div class="align-items-center shadow-lg  bg-body-tertiary rounded ">
						<h4 class="mb-4 text-center text-primary pt-3">Detalle de Solicitud</h4>
						<div class="table-responsive ">
							<div class="table-responsive">
								<table class="table table-bordered table-striped table-hover mb-0">
									<thead class="table-dark">
										<tr class="text-center">
											<th>Nombre del producto</th>
											<th>Cantidad Solicitada</th>
											<th>Cantidad Entregada</th>
											<th>Cantidad Faltante</th>
											<th
												th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
												Stock actual</th>
											<th
												th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
												Stock minimo</th>
										</tr>
									</thead>
									<tbody>
										<tr class="text-center" th:each="e : ${detallesolicitud}">
											<td th:text="${e.producto.nombre}"></td>
											<td th:text="${e.cantidad+ ' ' +e.producto.unidad.nombre}"></td>
											<td th:text="${e.cantidadEntregado+ ' ' +e.producto.unidad.nombre}"></td>
											<td th:classappend="${e.cantidad - e.cantidadEntregado > 0 ? 'text-danger' : 'text-success' }"
												th:text="${(e.cantidad - e.cantidadEntregado < 0 ? 0 : e.cantidad - e.cantidadEntregado ) + ' ' + e.producto.unidad.nombre}">
											</td>
											<td th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}"
												th:text="${e.producto.stockactual+ ' ' +e.producto.unidad.nombre}"></td>
											<td th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}"
												th:text="${e.producto.stockminimo+ ' ' +e.producto.unidad.nombre}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
				</article>
			</section>
		</div>
	</main>
</body>

</html>
