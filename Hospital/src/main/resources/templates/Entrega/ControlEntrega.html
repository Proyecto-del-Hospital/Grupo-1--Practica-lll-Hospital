<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/CSS/style.css}">
	<script src="https://kit.fontawesome.com/57faba85b1.js" crossorigin="anonymous"></script>
	<title>Control de Entrega</title>
	<style>
					body {
						background: linear-gradient(135deg, #022665 0%, #3794f1 70%, #759fee 100%);
						background-position: center;
						background-attachment: fixed;
									background-repeat: no-repeat;
						}

	</style>
	
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>
	<main>
		<section>
			<div class="justify-content-center w-100 p-5 ">
				<article th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
					<div class="row justify-content-center">
						<div class="col-md-8">
							<div th:if="${mensaje}" class="alert alert-info text-center pt-4" role="alert">
								<p th:text="${mensaje}"></p>
							</div>
							<div class="shadow-lg p-2 bg-body-tertiary rounded  bg-white border border-dark border-2 ">
								<h2 class="mb-4 text-center text-info">Entregar Productos</h2>
								<form class="row g-2" method="post" th:action="@{/Agregarproducto}">
									<div class="col-md-6">
										<label class="form-label fw-bold">Producto</label>
										<select class="form-control form-control-sm" name="productoId" required>
											<option value="">Seleccione un producto</option>
											<option th:each="p : ${ListaProductos}"
												th:text="${p.nombre + ', Tipo: '+ p.tipo.nombre + ', Unidad: ' + p.unidad.nombre +', Stock Actual: '+p.stockactual} "
												th:value="${p.id}">
											</option>
										</select>
									</div>
									<div class="col-md-6">
										<label class="form-label">Cantidad</label>
										<input type="number" class="form-control form-control-sm" name="cantidad"
											step="any" min="0" placeholder="Ingrese la cantidad" required>
									</div>
									<div class="col-12 mt-4">
										<button type="submit" class="btn btn-info w-100">Agregar a Lista</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</article>
				<br>
				<article th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
					<div class="row justify-content-center ">
						<div class="col-md-8">
							<div class="align-items-center shadow-lg p-3 mb-5 bg-body-tertiary rounded  bg-white border border-dark border-2">
								<div class="table-responsive">
									<table class="table table-bordered table-striped table-hover tabla-pacientes mb-0">
										<h2 class="text-center text-info pb-2">Lista de Productos a Entregar</h2>
										<thead class="table-dark">
											<tr class="text-center">
												<th>Producto</th>
												<th>Tipo</th>
												<th>Cantidad</th>
												<th>Unidad</th>
												<th>ACCIÓN</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="d : ${listaDetalles}" class="text-center">
												<td th:text="${d.producto.nombre}"></td>
												<td th:text="${d.producto.tipo.nombre}"></td>
												<td th:text="${d.cantidad}"></td>
												<td th:text="${d.producto.unidad.nombre}"></td>
												<td>
													<form method="post" th:action="@{/Quitarproductos}">
														<input type="hidden" name="posicion"
															th:value="${d.producto.id}">
														<button type="submit" class="btn btn-danger">Cancelar</button>
													</form>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</article>
				<article th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
					<div class="row justify-content-center">
						<div class="col-md-8">
							<div class="shadow-lg p-2 bg-body-tertiary rounded bg-white border border-dark border-2">
								<h2 class="mb-4 text-center text-info">Registrar Entrega</h2>
								<form class="row g-2" method="post" th:action="@{/Guardarentrega}">
									<div class="col-md-6">
										<label class="form-label">Fecha de Entrega</label>
										<input type="date" class="form-control form-control-sm" name="fecha" required>
									</div>
									<div class="col-md-6">
										<label class="form-label">Hora</label>
										<input type="time" class="form-control form-control-sm" name="hora" required>
									</div>
									<div class="col-12 mt-4">
										<label class="form-label fw-bold">Empleado</label>
										<select class="form-control form-control-sm" name="id_empleado" required>
											<option value="">Seleccione el empleado</option>
											<option th:each="e : ${ListaEmpleados}" th:text="${e.nombre}"
												th:value="${e.id}">
											</option>
										</select>
									</div>
									<div class="col-12 mt-4">
										<button type="button" class="btn btn-success w-100" data-bs-toggle="modal"
											data-bs-target="#modalGuardar">
											Guardar
										</button>
									</div>
									<div class="modal fade" id="modalGuardar" tabindex="-1"
										aria-labelledby="exampleModalLabel" aria-hidden="true">
										<div class="modal-dialog">
											<div class="modal-content">
												<div class="modal-header">
													<h5 class="modal-title" id="exampleModalLabel">Confirmar Guardado
													</h5>
												</div>
												<div class="modal-body">
													¿Estás seguro de que deseas guardar la entrega?
												</div>
												<div class="modal-footer">
													<button type="button" class="btn btn-secondary"
														data-bs-dismiss="modal">Cerrar</button>
													<button type="submit" class="btn btn-success">Confirmar
														Guardado</button>
												</div>
											</div>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</article>
				<br>
				<article>
					<div class="row justify-content-center">
						<div class="col-md-8">
							<div class="align-items-center shadow-lg p-3 mb-5 bg-body-tertiary rounded bg-white border border-dark border-2 ">
								<h2 class="text-center text-info pb-2">Entregas Realizadas</h2>
								<form class="d-flex me-2" th:action="@{/buscarentrega}" method="post">
									<input class="form-control me-2" type="text" name="fecha"
										placeholder="Buscar entrega">
									<button class="btn btn-outline-success" type="submit">Buscar</button>
								</form>
								<br>
								<div class="table-responsive">
									<table class="table table-bordered table-striped table-hover tabla-pacientes mb-0">
										<thead class="table-dark">
											<tr class="text-center">
												<th>Id</th>
												<th>Fecha</th>
												<th>Hora</th>
												<th>Empleado Entregado</th>
												<th>ACCIÓN</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="e : ${ListaEntregas}" class="text-center" th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador' 
											or e.empleado.DNI == session.empleadologueado.usuario.empleado.DNI}">
												<td th:text="${e.id}"></td>
												<td th:text="${e.fecha}"></td>
												<td th:text="${e.hora}"></td>
												<td>
													<span
														th:text="${e.empleado.nombre + ' ' + e.empleado.apellido}"></span>
													<span class="text-muted"
														th:text="' (' + ${e.empleado.usuario.rol.nombre} + ')'"></span>
												</td>
												<td><a class="btn btn-primary btn-sm"
														th:href="@{/MostrarDetalle(id=${e.id})}">Ver detalle</a>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
			</article>
			</div>
		</section>
	</main>
	

	<script th:src="@{/js/bootstrap.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>


</html>
