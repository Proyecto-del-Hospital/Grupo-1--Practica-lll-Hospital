<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/CSS/style.css}">
	<script src="https://kit.fontawesome.com/57faba85b1.js" crossorigin="anonymous"></script>
	<title>Control de Entrega</title>
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>
	<main>
		<section>
			<div class="justify-content-center w-100 p-5">
				<article>
					<div class="row justify-content-center">
						<div class="col-md-8">
							<div class="align-items-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
								<h2 class="text-center text-info pb-2">Detalle de la Entrega</h2>
								<div class="table-responsive ">
									<table class="table table-bordered table-striped align-middle mb-0">
										<tbody>
											<tr>
												<th class="table-light">Empleado</th>
												<td th:text="${Entrega.empleado.nombre}"></td>
											</tr>
											<tr>
												<th class="table-light">Fecha</th>
												<td th:text="${Entrega.fecha}"></td>
											</tr>
											<tr>
												<th class="table-light">Hora</th>
												<td th:text=${Entrega.hora}></td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</article>
				<article>
					<div class="row justify-content-center">
						<div class="col-md-8">
							<div class="align-items-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
								<div class="table-responsive">
									<table class="table table-bordered table-striped table-hover tabla-pacientes mb-0">
										<h2 class="text-center text-info pb-2">Productos Entregados</h2>
										<thead class="table-dark">
											<tr class="text-center">
												<th>ID</th>
												<th>Producto</th>
												<th>Tipo</th>
												<th>Cantidad</th>
												<th>Unidad</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="e : ${Entrega.det_entrega}" class="text-center">
												<td th:text="${e.id}"></td>
												<td th:text="${e.producto.nombre}"></td>
												<td th:text="${e.producto.tipo.nombre}"></td>
												<td th:text="${e.cantidad}"></td>
												<td th:text="${e.producto.unidad.nombre}"></td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</article>
			</div>
		</section>
	</main>
</body>

</html>
