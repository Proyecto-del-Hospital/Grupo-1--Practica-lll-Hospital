<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<title>Control de Pedidos</title>
	<style>
		body {
			background: linear-gradient(135deg, #07506a 0%, #44a9b1 50%, #45adad 100%);
			background-position: center;
			background-attachment: fixed;
			background-repeat: no-repeat;
		}
	</style>
</head>

<body>
	<header>
		<div th:replace="Inicio/Inicioprueba::navbarprueba"></div>
	</header>

	<main class="container my-4">
		<section>
			<div>
				<div th:if="${mensaje}" class="alert alert-success text-center">
					<p th:text="${mensaje}" class="mb-0"></p>
				</div>

				<article class="mb-4" th:if="${session.empleadologueado.usuario.rol.nombre == 'Administrador'}">
					<div class="row justify-content-center">
						<div class="col-md-13">
							<div class="shadow-lg p-4 bg-body-tertiary rounded  bg-white border border-dark border-2">
								<h3 class="text-center text-primary pb-3">Listado de Facturas</h3>
								<form class="d-flex me-2 mb-3" th:action="@{/busquedafactura}" method="post">
									<input class="form-control me-2" type="text" name="numfactura"
										placeholder="Ingrese el numero de factura">
									<button class="btn btn-outline-success" type="submit">Buscar</button>
								</form>
								<div class="table-responsive">
									<table class="table table-bordered table-striped table-hover align-middle mb-0">
										<thead class="table-dark">
											<tr class="text-center text-nowrap align-middle">
												<th>N° de Factura</th>
												<th>Fecha de emisión</th>
												<th>Proveedor</th>
												<th>N° de Pedido</th>
												<th>Total</th>
												<th>Acciones</th>
											</tr>
										</thead>
										<tbody class="text-center text-nowrap align-middle">
											<tr th:each="f : ${ListaFacturas}" class="text-center ">
												<td th:text="${f.numfactura}"></td>
												<td th:text="${f.fechaemision}"></td>
												<td th:text="${f.proveedor.nombre}"></td>
												<td class="fw-bold" th:text="${'#' + f.pedido.id}"></td>
												<td th:text="${f.total}"></td>
												<td>
													<div class="d-flex justify-content-center align-items-center gap-2 text-nowrap"
														style="gap: 8px;">
														<a class="btn btn-info btn-sm"
															th:href="@{/detalleFactura(idFactura=${f.id})}">
															Ver Detalle
														</a>
														<a class="btn btn-info btn-sm"
															th:href="@{/detallePedido(idPedido=${f.pedido.id})}">
															Ver Pedido
														</a>
													</div>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</article>
			</div>
		</section>
	</main>
</body>

<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</html>
