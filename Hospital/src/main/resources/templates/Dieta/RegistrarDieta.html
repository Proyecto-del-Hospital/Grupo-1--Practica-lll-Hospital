<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/CSS/style.css}">
	<title>Registrar Dieta</title>
</head>

<body class="bg-light">
	<main>
		<section>
			<article>
				<div>
					<div class="justify-content-center w-100 p-5">
						<div>
							<a th:href="@{/}" class="btn btn-secondary mb-3">
							    ← Volver al inicio
							</a>
							<div class="shadow-lg p-2 bg-body-tertiary rounded">
								<h1 class="mb-4 text-center text-primary">Registrar Dieta, Sala y Patologías</h1>
								<form class="row g-2" method="post" th:action="@{/dieta/crear}" th:object="${dieta}">
									<!--Seleccion de Paciente-->
									<div class="col-12 mb-2">
										<label class="form-label fw-bold">Paciente</label>
										<select class="form-select form-select-sm" th:field="*{paciente.id}" required>
											<option value="">Seleccione un paciente...</option>
											<option th:each="p : ${listaPacientes}" th:value="${p.id}"
												th:text="${p.nombre + ' ' + p.apellido + ' (DNI: ' + p.dni + ')'}">
											</option>
										</select>
									</div>

									<!--Apartado de Dieta-->
									<div class="col-md-6">
										<label class="form-label">Fecha Inicial</label>
										<input type="date" class="form-control form-control-sm"
											th:field="*{fechaInicio}" required>
									</div>
									<div class="col-md-6">
										<label class="form-label">Fecha Fin</label>
										<input type="date" class="form-control form-control-sm" th:field="*{fechaFin}">
									</div>

									<!--Seleccion De Sala-->
									<div class="col-md-6">
										<label class="form-label">
											Sala Existente
										</label>
										<select class="form-select form-select-sm" name="SalaId">
											<option value="">
												Seleccione una sala...
											</option>
											<option th:each="s : ${listaSalas}" th:value="${s.id}"
												th:text="${s.nombre}">
											</option>
										</select>
									</div>
									<div class="col-md-6">
										<label class="form-label">
											O Nueva Sala
										</label>
										<input type="text" class="form-control form-control-sm" name="SalaNueva"
											placeholder="Ej: Sala 3B">
									</div>

									<!--Seleccion De Estado-->
									<div class="col-12" th:object="${dieta.estado}">
										<label class="form-label">Estado</label>
										<select class="form-control" th:field="*{nombre}">
											<option value="habilitado">Habilitado</option>
											<option value="inhabilitado">Inhabilitado</option>
										</select>
									</div>

									<div class="col-12">
										<label class="form-label">Motivo</label>
										<input type="text" class="form-control form-control-sm" th:field="*{motivo}"
											placeholder="Ej: Control general" required>
									</div>

									<div class="col-12">
										<label class="form-label">Descripción</label>
										<textarea class="form-control form-control-sm" rows="2"
											th:field="*{descripcion}" placeholder="Detalles..."></textarea>
									</div>

									<div class="col-12 mt-4 border-top pt-3">
										<label class="form-label fw-bold text-secondary">Patologías Asociadas</label>
										<p class="text-muted small mb-2">Marque las patologías existentes o escriba una
											nueva:
										</p>

										<!--Seleccion De Patologia -->
										<div class="d-flex flex-row">

											<div class="form-check form-check-inline"
												th:each="patologia : ${listaPatologias}">

												<input class="form-check-input" type="checkbox" name="patologiasIds"
													th:value="${patologia.id}" th:id="${patologia.id}">

												<label class="form-check-label" th:for="${patologia.id}"
													th:text="${patologia.nombre}">
													Patología
												</label>
											</div>
										</div>
										<div class="mt-3">
											<label class="form-label text-muted small">¿No encuentra la patología?
												Escríbala
												aquí:</label>
											<input type="text" class="form-control form-control-sm"
												name="patologiaNuevaTexto" placeholder="Ej: Hipertensión">
										</div>
									</div>
									<div class="col-12 mt-4">
										<button type="submit" class="btn btn-primary btn-sm w-100">Registrar
											Dieta</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</article>
			<div th:if="${mensaje}" class="alert alert-danger" th:text="${mensaje}">
				
			</div>
			<!--Lista De Dietas-->
			</div>
			<article>
				<!--Listado de Dietas -->
				<div class="align-items-center shadow-lg p-3 mb-5 bg-body-tertiary rounded">
					<div class="table-responsive">
						<table class="table table-bordered table-striped table-hover mb-0 ">
							<thead class="table-dark">
								<tr class="text-center">
									<th>#</th>
									<th>Paciente</th>
									<th>fechaInicio</th>
									<th>fechaFin</th>
									<th>descripcion</th>
									<th>motivo del estado</th>
									<th>Estado</th>
									<th>Acción</th>
								</tr>
							</thead>
							<tbody>
								<tr class="text-center" th:each="d : ${listaDietas}">
									<td th:text="${d.id}"></td>
									<td th:text="${d.Paciente.nombre}"></td>
									<td th:text=${d.fechaInicio}></td>
									<td th:text=${d.fechaFin}></td>
									<td th:text=${d.descripcion}></td>
									<td th:text=${d.motivo}></td>
									<td>
										<span class="badge estado-badge"
											th:classappend="${d.estado.nombre == 'habilitado'} ? ' bg-success' : ' bg-danger'"
											th:text="${d.estado.nombre}">
										</span>
									</td>
									<!--Botones-->
									<td>
										<div>
											<a class="btn btn-warning btn-sm"
												th:href="@{/editar(id=${d.id})}">Editar</a>
											<a class="btn btn-danger btn-sm" th:href="@{/CambiarEstado(id=${d.id})}">
												Canbiar Estado
											</a>
											<a class="btn btn-success btn-sm" th:href="@{/CambiarEstado(id=${d.id})}">
												Ver
											</a>
										</div>
									</td>
								</tr>

							</tbody>
						</table>
					</div>
				</div>
				</div>
			</article>
		</section>
	</main>

</body>

</html>
