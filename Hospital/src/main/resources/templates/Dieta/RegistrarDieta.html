<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/CSS/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/CSS/style.css}">
	<title>Registrar Dieta</title>
</head>

<body class="bg-light">
	<main>
		<div class="container mt-5 mb-5">
			<div class="row justify-content-center">
				<div class="col-md-8">
					<div class="card shadow-sm p-4">
						<h3 class="mb-4 text-center text-primary">Registrar Dieta, Sala y Patologías</h3>


						<form class="row g-2" method="post" th:action="@{/dieta/crear}" th:object="${dieta}">

							<div class="col-12 mb-2">
								<label class="form-label fw-bold">Paciente</label>
								<select class="form-select form-select-sm" th:field="*{paciente.id}" required>
									<option value="">Seleccione un paciente...</option>
									<option th:each="p : ${listaPacientes}" th:value="${p.id}"
										th:text="${p.nombre + ' ' + p.apellido + ' (DNI: ' + p.dni + ')'}">
									</option>
								</select>
							</div>

							<div class="col-md-6">
								<label class="form-label">Fecha Inicial</label>
								<input type="date" class="form-control form-control-sm" th:field="*{fechaInicio}"
									required>
							</div>

							<div class="col-md-6">
								<label class="form-label">Fecha Fin</label>
								<input type="date" class="form-control form-control-sm" th:field="*{fechaFin}">
							</div>
								<div class="col-md-6">

									<label class="form-label">
										Sala Existente
									</label>

									<select class="form-select form-select-sm" name="SalaId">

										<option value="">
											Seleccione una sala...
										</option>

										<option th:each="s : ${listaSalas}" th:value="${s.id}" th:text="${s.nombre}">
										</option>

									</select>

								</div>
								<div class="col-md-6">

									<label class="form-label">
										O Nueva Sala
									</label>

									<input type="text" class="form-control form-control-sm" name="SalaNueva"
										placeholder="Ej: Sala 3B">

								</div>
								<div class="col-12" th:object="${dieta.estado}">
									<label class="form-label">Estado</label>
									<select class="form-control" th:field="*{nombre}">
										<option value="habilitado">Habilitado</option>
										<option value="inhabilitado">Inhabilitado</option>
									</select>
								</div>
								
								<div class="col-12">
									<label class="form-label">Motivo</label>
									<input type="text" class="form-control form-control-sm" th:field="*{motivo}"
										placeholder="Ej: Control general" required>
								</div>

								<div class="col-12">
									<label class="form-label">Descripción</label>
									<textarea class="form-control form-control-sm" rows="2" th:field="*{descripcion}"
										placeholder="Detalles..."></textarea>
								</div>

								<div class="col-12 mt-4 border-top pt-3">
									<label class="form-label fw-bold text-secondary">Patologías Asociadas</label>
									<p class="text-muted small mb-2">Marque las patologías existentes o escriba una
										nueva:
									</p>

									<div class="form-check mb-1" th:each="patologia : ${listaPatologias}">
										<input class="form-check-input" type="checkbox" name="patologiasIds"
											th:value="${patologia.id}" th:id="${'pat_' + patologia.id}">
										<label class="form-check-label" th:for="${'pat_' + patologia.id}"
											th:text="${patologia.nombre}">
											Patología
										</label>
									</div>

									<div class="mt-3">
										<label class="form-label text-muted small">¿No encuentra la patología? Escríbala
											aquí:</label>
										<input type="text" class="form-control form-control-sm"
											name="patologiaNuevaTexto" placeholder="Ej: Hipertensión">
									</div>
								</div>
								<div class="col-12 mt-4">
									<button type="submit" class="btn btn-primary btn-sm w-100">Registrar Dieta</button>
								</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>

</html>
